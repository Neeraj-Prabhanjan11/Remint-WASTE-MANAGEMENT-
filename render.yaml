services:
  - type: web
    name: remint-api
    runtime: node
    plan: free
    region: singapore
    branch: neeraj-prabhanjan11-waste-value-chain-infographic
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /tmp/remint.sqlite
      - key: APP_ORIGIN
        value: https://neeraj-prabhanjan11.github.io
