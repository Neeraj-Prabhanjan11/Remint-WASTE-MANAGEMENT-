services:
  remint:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-4179}:4179"
    environment:
      DB_PATH: /data/remint.sqlite
    volumes:
      - remint-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4179/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  remint-data:
